name: Verify software and firmware
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install tzdata==2025.2
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/test_web.cjs tests/test_setup.cjs
      - run: python tools/package.py
      - name: Check deployment shell syntax
        if: runner.os == 'Linux'
        run: bash -n deploy/install-ubuntu.sh
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.2.2'
      - name: Install pinned board core and libraries
        run: |
          arduino-cli config init
          arduino-cli config set network.connection_timeout 1800s
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0
          arduino-cli lib install 'Adafruit ILI9341@1.6.1' 'Adafruit GFX Library@1.11.11' 'Adafruit BusIO@1.17.0' 'ArduinoJson@7.4.2'
      - name: Compile release and demo
        run: |
          target='esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,USBMode=hwcdc,CDCOnBoot=cdc'
          arduino-cli compile --fqbn "$target" --build-property compiler.cpp.extra_flags=-DCODEX_DEMO=0 --output-dir firmware/build/release firmware/CodexDesk
          arduino-cli compile --fqbn "$target" --build-property compiler.cpp.extra_flags=-DCODEX_DEMO=1 --output-dir firmware/build/demo firmware/CodexDesk
          sha256sum firmware/build/*/*.bin > firmware/build/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp32-firmware
          path: firmware/build/
          retention-days: 14
